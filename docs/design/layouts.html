<style>
  body { margin: 0; background: #F6F6F4; color: #16181D; font-family: "Geist", ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; }
  .fields { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .fields::before, .fields::after { content: ""; position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
  .fields::before { width: 560px; height: 560px; background: #FFC2BC; top: -200px; left: -180px; }
  .fields::after { width: 520px; height: 520px; background: #BFD4FF; top: 500px; right: -200px; }
  .frame { position: relative; isolation: isolate; container-type: inline-size; margin: 0 auto; background: #F6F6F4; border-radius: 20px; overflow: hidden;
    box-shadow: 0 30px 80px -40px rgba(0,0,0,.45); border: 1px solid rgba(18,18,31,.12); transition: max-width .45s cubic-bezier(.2,.8,.2,1); }
  .rail { scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .rail::-webkit-scrollbar { display: none; } .rail > * { scroll-snap-align: start; }
  .seg button[aria-pressed="true"] { background: #16181D; color: #fff; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fade-in { animation: fade .3s cubic-bezier(.2,.8,.2,1); } @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  .drawer { transition: transform .3s cubic-bezier(.2,.8,.2,1); } .scrim { transition: opacity .3s; }
  svg { display: inline-block; vertical-align: -0.125em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

    <div class="flex items-center gap-2"><span class="text-muted-foreground">Width</span>
      <div class="seg flex rounded-lg border border-border bg-white p-0.5" id="seg-width">

</div>

const TODAY = new Date("2026-10-07T12:00:00");
const money = c => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function arrive(d) { const x = new Date(TODAY); let n = d + 2; while (n > 0) { x.setDate(x.getDate() + 1); if (x.getDay() % 6) n--; } return x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
const stars = r => '<span class="inline-flex text-star text-[13px] [&_svg]:fill-current">' + I.star.repeat(Math.round(r)) + '</span><span class="inline-flex text-star/30 text-[13px]">' + I.star.repeat(5 - Math.round(r)) + "</span>";
const fmtCount = n => n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "K" : String(n);
const btn = (cls, inner) => '<button class="inline-flex h-8 items-center justify-center gap-1.5 rounded-lg px-2.5 text-sm font-medium whitespace-nowrap transition-all active:translate-y-px ' + cls + '">' + inner + "</button>";

function card(p, w = "w-[46cqw] @md:w-[30cqw] @3xl:w-[200px]") {
  const off = Math.round((1 - p.price_cents / p.list_price_cents) * 100);
  return '<article class="' + w + ' shrink-0 glass rounded-xl p-2.5 flex flex-col gap-1.5 transition-transform duration-200 hover:-translate-y-0.5">' +
    '<div class="aspect-square rounded-lg bg-white/80 grid place-items-center overflow-hidden"><img loading="lazy" src="' + p.thumbnail + '" alt="" class="h-full w-full object-contain p-2"></div>' +
    '<h3 class="clamp2 text-[13px] leading-snug font-medium min-h-[2.5em]">' + p.title + "</h3>" +
    '<div class="flex items-center gap-1 text-xs text-muted-foreground">' + stars(p.rating) + " " + fmtCount(p.rating_count) + "</div>" +
    '<div class="flex items-baseline gap-1.5">' + (off >= 1 ? '<span class="text-xs font-semibold text-sale">-' + off + "%</span>" : "") + '<span class="text-lg font-bold">' + money(p.price_cents) + "</span>" +
    (off >= 1 ? '<s class="text-xs text-muted-foreground">' + money(p.list_price_cents) + "</s>" : "") + "</div>" +
    '<div class="text-xs text-muted-foreground flex items-center gap-1">' + I.truck + ' Arrives <b class="text-foreground font-semibold">' + arrive(p.dispatch_days_min) + "</b></div>" +
    btn("mt-auto bg-brand text-brand-foreground hover:bg-brand/90 w-full", I["shopping-cart"] + " Add to cart") + "</article>";
}
function rail(title, items, icon = "") {
  return '<section class="mt-6"><div class="mb-2 flex items-center justify-between px-1"><h2 class="text-lg font-semibold tracking-tight flex items-center gap-2">' + icon + title +
    '</h2><a class="text-sm font-medium text-foreground/80 hover:text-foreground flex items-center">See all ' + I["chevron-right"] + "</a></div>" +
    '<div class="rail flex gap-3 overflow-x-auto pb-2">' + items.map(p => card(p)).join("") + "</div></section>";
}
const catChips = (cls = "") => DATA.cats.map(c => '<a class="shrink-0 rounded-full border border-border bg-white/60 px-3 py-1.5 text-[13px] font-medium hover:bg-white transition-colors ' + cls + '">' + c.name + "</a>").join("");

  '<input aria-label="Search" placeholder="Search Olympus Cart" class="min-w-0 flex-1 border border-input bg-white/90 px-3 ' + (big ? "text-base rounded-l-xl @3xl:rounded-l-none" : "text-sm rounded-l-lg @3xl:rounded-l-none") + ' outline-none focus-visible:ring-3 focus-visible:ring-ring/40">' +
  '<button aria-label="Search" class="grid place-items-center bg-brand px-4 text-brand-foreground ' + (big ? "rounded-r-xl text-lg" : "rounded-r-lg") + ' hover:bg-brand/90 transition-colors">' + I.search + "</button></form>";

const metaLinks = '<div class="hidden @3xl:flex items-center gap-4 text-[13px]">' +

  '<a class="flex items-center gap-1">' + I.user + " Sign in</a>" + '<a class="flex items-center gap-1">' + I.package + " Orders</a></div>";

function header1() {

    '<div class="flex flex-wrap items-center gap-3 px-3 py-2.5">' + logo + '<div class="order-last w-full @3xl:order-none @3xl:w-auto @3xl:flex-1 flex">' + search() + "</div>" + metaLinks +

function header2() {
  return demo + '<header class="sticky top-0 z-20 px-3 pt-3"><div class="glass rounded-2xl flex flex-wrap items-center gap-3 px-3 py-2.5">' +
    '<button onclick="openDrawer()" class="flex items-center gap-1.5 rounded-lg px-2 py-2 text-sm font-semibold hover:bg-secondary">' + I.menu + ' <span class="hidden @md:inline">All</span></button>' + logo +

window.openDrawer = () => { drawer.style.transform = "translateX(0)"; scrim.style.opacity = 1; scrim.style.pointerEvents = "auto"; };

const topCats = DATA.cats.filter(c => c.items && c.items.length >= 5).slice(0, 4);
function homeA() {
  const d = DATA.deals[0];
  return '<main class="px-3 pb-10">' +

    '<div class="mt-5 flex flex-wrap gap-2">' + btn("h-10 px-4 bg-brand text-brand-foreground hover:bg-brand/90", I.zap + " Shop today's deals") + btn("h-10 px-4 border border-border bg-white/70 hover:bg-white", "Browse categories") + "</div></div>" +

    rail("Today's deals", DATA.deals, '<span class="text-brand">' + I.zap + "</span>") +
    rail("Top rated", DATA.top, '<span class="text-star">' + I.trophy + "</span>") +
    topCats.map(c => rail(c.name, c.items)).join("") + "</main>";

function homeB() {
  const tile = c => '<a class="glass rounded-2xl p-4 flex flex-col gap-3 transition-transform duration-200 hover:-translate-y-0.5"><h2 class="font-semibold tracking-tight">' + c.name + "</h2>" +
    '<div class="grid grid-cols-2 gap-2">' + c.items.slice(0, 4).map(p => '<div><div class="aspect-square rounded-lg bg-white/80 grid place-items-center p-2"><img loading="lazy" src="' + p.thumbnail + '" alt="" class="max-h-full object-contain"></div><p class="mt-1 truncate text-xs text-muted-foreground">' + p.title + "</p></div>").join("") +
    '</div><span class="mt-auto text-sm font-medium flex items-center">Shop ' + c.name + " " + I["chevron-right"] + "</span></a>";

    rail("Today's deals", DATA.deals, '<span class="text-brand">' + I.zap + "</span>") + rail("Top rated", DATA.top, '<span class="text-star">' + I.trophy + "</span>") +

const EXPLAIN = {
  A: "<b>A · Hero + rails.</b> A slim promo hero (with 4 live deals on desktop), then rails of real products: deals, top rated, then the top categories. Every tile is one click from its product page.",
  B: "<b>B · Category grid.</b> Amazon-style 4-up department cards, each showing 4 real products, then the deals and top-rated rails.",
  C: "<b>C · Search-first.</b> A large centred search and department chips as the hero, with product rails below. Note that the header search is then a second search box on the page.",
  1: "<b>Header 1.</b> A sticky glass bar with every category visible in a scrollable row and Today's deals first. One tap to any department.",
  2: "<b>Header 2.</b> A cleaner bar. Categories sit behind an \"All\" button that slides in a drawer, as on Amazon. Click \"All\" to try it.",
};
const state = { home: "A", header: "1", width: "desktop" };
try { Object.assign(state, JSON.parse(localStorage.getItem("oc-layout") || "{}")); } catch {}
function render() {
  const run = () => {
    app.innerHTML = (state.header === "1" ? header1() : header2()) + ({ A: homeA, B: homeB, C: homeC })[state.home]();
    app.firstElementChild && app.classList.remove("fade-in"); void app.offsetWidth; app.classList.add("fade-in");
    frame.style.maxWidth = state.width === "mobile" ? "390px" : "1280px";
    explain.innerHTML = EXPLAIN[state.home] + " " + EXPLAIN[state.header];
    for (const [id, key] of [["seg-home", "home"], ["seg-header", "header"], ["seg-width", "width"]])
      document.querySelectorAll("#" + id + " button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state[key]));
    try { localStorage.setItem("oc-layout", JSON.stringify(state)); } catch {}
  };
  run();
}
for (const [id, key] of [["seg-home", "home"], ["seg-header", "header"], ["seg-width", "width"]])
  document.querySelectorAll("#" + id + " button").forEach(b => b.onclick = () => { state[key] = b.dataset.v; render(); });
render();

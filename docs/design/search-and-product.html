  if (instant) sh.style.transition = "none";
  sh.style.translate = "0 0"; sc.style.opacity = 1; sc.style.pointerEvents = "auto";
  if (instant) requestAnimationFrame(() => sh.style.transition = "");
}
function closeSheet() { sheetOpen = false; const sh = document.getElementById("sheet"), sc = document.getElementById("scrim"); sh.style.translate = ""; sc.style.opacity = 0; sc.style.pointerEvents = "none"; }
function openPop(btn) {
  const pop = document.getElementById("popover"); const id = btn.dataset.pop;
  const all = filterGroups(); const tmp = document.createElement("div"); tmp.innerHTML = all;
  const idx = { delivery: 0, rating: 1, price: 2, brand: 3 }[id];
  pop.innerHTML = '<form class="filters">' + tmp.children[idx].outerHTML + "</form>";
  const fr = frame.getBoundingClientRect(), br = btn.getBoundingClientRect();
  pop.style.left = (br.left - fr.left) + "px"; pop.style.top = (br.bottom - fr.top + 8) + "px"; pop.classList.remove("hidden");
  pop.querySelector("form").onchange = e => { const merged = document.createElement("form"); merged.innerHTML = filterGroups(); /* keep other groups */
    const f = pop.querySelector("form"); const fd = new FormData(f);
    if (id === "brand") F.brands = new Set(fd.getAll("brand")); if (id === "price") F.price = fd.get("price") || ""; if (id === "rating") F.rating = Number(fd.get("rating") || 0);
    if (id === "delivery") { F.fast = fd.has("fast"); F.inStock = fd.has("stock"); }
    render(true); const again = document.querySelector('[data-pop="' + id + '"]'); if (again) openPop(again); };
  setTimeout(() => document.addEventListener("click", function h(e) { if (!pop.contains(e.target) && !e.target.closest("[data-pop]")) { pop.classList.add("hidden"); document.removeEventListener("click", h); } }), 0);
}
for (const [id, key] of [["seg-page", "page"], ["seg-width", "width"]])
  document.querySelectorAll("#" + id + " button").forEach(b => b.onclick = () => { state[key] = b.dataset.v; closeSheet && (sheetOpen = false); render(); });
render();
</script>

const I = {"search":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m21 21-4.34-4.34\" /> <circle cx=\"11\" cy=\"11\" r=\"8\" /> </svg>","shopping-cart":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18\" /> <path d=\"M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25\" /> <circle cx=\"18\" cy=\"20\" r=\"2\" /> <circle cx=\"8\" cy=\"20\" r=\"2\" /> </svg>","user":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\" /> <circle cx=\"12\" cy=\"7\" r=\"4\" /> </svg>","menu":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M4 5h16\" /> <path d=\"M4 12h16\" /> <path d=\"M4 19h16\" /> </svg>","x":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M18 6 6 18\" /> <path d=\"m6 6 12 12\" /> </svg>","star":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z\" /> </svg>","truck":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2\" /> <path d=\"M15 18H9\" /> <path d=\"M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14\" /> <circle cx=\"17\" cy=\"18\" r=\"2\" /> <circle cx=\"7\" cy=\"18\" r=\"2\" /> </svg>","chevron-right":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"m9 18 6-6-6-6\" /> </svg>","plus":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M5 12h14\" /> <path d=\"M12 5v14\" /> </svg>","map-pin":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\" /> <circle cx=\"12\" cy=\"10\" r=\"3\" /> </svg>","package":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z\" /> <path d=\"M12 22V12\" /> <polyline points=\"3.29 7 12 12 20.71 7\" /> <path d=\"m7.5 4.27 9 5.15\" /> </svg>","arrow-right":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" > <path d=\"M5 12h14\" /> <path d=\"m12 5 7 7-7 7\" /> </svg>"};
const CAT = Object.fromEntries(DATA.cats.map(c => [c.slug, c]));
const TODAY = new Date("2026-10-07T12:00:00");
const money = c => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function arrive(d) { const x = new Date(TODAY); let n = d + 2; while (n > 0) { x.setDate(x.getDate() + 1); if (x.getDay() % 6) n--; } return x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
const fmt = n => n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "K" : String(n);

// Calm card: image, title, price, one line of rating + delivery. A small "+" replaces the full-width button.
function card(p) {
  const off = Math.round((1 - p.price_cents / p.list_price_cents) * 100);
  return '<a href="#" class="card group w-[44cqw] @md:w-[30cqw] @3xl:w-auto shrink-0 flex flex-col gap-2">' +
    '<div class="relative aspect-square overflow-hidden rounded-2xl bg-white/80"><img loading="lazy" src="' + p.thumbnail + '" alt="" class="h-full w-full object-contain p-4">' +
    (off >= 5 ? '<span class="absolute left-2.5 top-2.5 rounded-full bg-white/90 px-2 py-0.5 text-[11px] font-semibold text-sale">-' + off + "%</span>" : "") +
    '<button aria-label="Add ' + p.title + ' to cart" onclick="event.preventDefault()" class="absolute bottom-2.5 right-2.5 grid size-9 place-items-center rounded-full bg-primary text-primary-foreground text-lg shadow-md transition-transform hover:scale-105 active:scale-95">' + I.plus + "</button></div>" +
    '<div class="px-0.5"><h3 class="clamp2 text-sm leading-snug">' + p.title + "</h3>" +
    '<div class="mt-1 flex items-baseline gap-1.5"><span class="text-base font-semibold">' + money(p.price_cents) + "</span>" + (off >= 1 ? '<s class="text-xs text-muted-foreground">' + money(p.list_price_cents) + "</s>" : "") + "</div>" +
    '<p class="mt-0.5 text-xs text-muted-foreground"><span class="text-star [&_svg]:fill-current">' + I.star + "</span> " + p.rating.toFixed(1) + " · Arrives " + arrive(p.dispatch_days_min) + "</p></div></a>";
}
function rail(title, sub, items) {
  return '<section class="mt-14 @3xl:mt-20"><div class="mb-5 flex items-end justify-between gap-4"><div><h2 class="text-xl @3xl:text-2xl font-semibold tracking-tight">' + title + '</h2><p class="mt-1 text-sm text-muted-foreground">' + sub + "</p></div>" +
    '<a href="#" class="shrink-0 text-sm font-medium flex items-center gap-1 text-foreground/80 hover:text-foreground">See all ' + I["arrow-right"] + "</a></div>" +
    '<div class="rail flex gap-4 overflow-x-auto @3xl:grid @3xl:grid-cols-5 @3xl:gap-6 @3xl:overflow-visible">' + items.slice(0, 5).map(card).join("") + "</div></section>";
}
const searchForm = (big, id) => '<form id="' + id + '" role="search" onsubmit="return false" class="group flex w-full items-center gap-2 rounded-full border border-input bg-white/90 ' + (big ? "h-14 pl-5 pr-1.5 shadow-[0_8px_30px_-12px_rgba(0,0,0,.25)]" : "h-10 pl-4 pr-1") + ' transition-shadow focus-within:ring-3 focus-within:ring-ring/25">' +
  '<span class="text-muted-foreground ' + (big ? "text-lg" : "") + '">' + I.search + "</span>" +
  '<input aria-label="Search Olympus Cart" placeholder="' + (big ? "Search 184 products, e.g. wireless earphones" : "Search Olympus Cart") + '" class="min-w-0 flex-1 bg-transparent outline-none ' + (big ? "text-base" : "text-sm") + '">' +
  '<button class="rounded-full bg-brand font-medium text-brand-foreground transition-colors hover:bg-brand/90 ' + (big ? "h-11 px-6" : "h-8 px-4 text-sm") + '">Search</button></form>';

function header() {
  return '<p class="bg-primary px-4 py-1.5 text-center text-[11px] text-primary-foreground">Demo project, not affiliated with Amazon. Checkout runs in Stripe test mode.</p>' +
    '<header id="hdr" class="sticky top-0 z-20 px-3 pt-3"><div class="glass flex h-14 items-center gap-2 rounded-2xl px-2 @3xl:px-3">' +
    '<button onclick="openDrawer()" class="flex h-10 items-center gap-2 rounded-xl px-2.5 text-sm font-medium hover:bg-black/5 transition-colors">' + I.menu + "<span>All</span></button>" +
    '<a href="#" class="px-1 text-lg font-bold tracking-tight whitespace-nowrap">Olympus<span class="text-star">Cart</span></a>' +
    '<div class="hsearch hidden @3xl:block mx-auto w-full max-w-xl">' + searchForm(false, "hs") + "</div>" +
    '<div class="ml-auto @3xl:ml-0 flex items-center gap-1">' +
    '<button onclick="toHero()" aria-label="Search" class="hsearch @3xl:hidden grid size-10 place-items-center rounded-xl hover:bg-black/5">' + I.search + "</button>" +
    '<a href="#" class="flex h-10 items-center gap-1.5 rounded-xl px-2.5 text-sm hover:bg-black/5">' + I.user + '<span class="hidden @md:inline">Sign in</span></a>' +
    '<a href="#" aria-label="Cart, 2 items" class="relative grid size-10 place-items-center rounded-xl hover:bg-black/5 text-lg">' + I["shopping-cart"] +
    '<span class="absolute right-0.5 top-0.5 grid min-w-4 h-4 place-items-center rounded-full bg-brand px-1 text-[10px] font-bold text-brand-foreground">2</span></a></div></div></header>' +
    '<div id="scrim" onclick="closeDrawer()" class="scrim fixed-in-frame absolute inset-0 z-30 bg-black/25 opacity-0 pointer-events-none"></div>' +
    '<aside id="drawer" aria-label="All departments" class="drawer absolute left-0 top-0 z-40 h-full w-[min(340px,88%)] -translate-x-full bg-white/95 backdrop-blur-xl shadow-2xl">' +
    '<div class="sticky top-0 p-5"><div class="mb-4 flex items-center justify-between"><b class="text-base">All departments</b><button onclick="closeDrawer()" aria-label="Close" class="grid size-9 place-items-center rounded-xl hover:bg-black/5">' + I.x + "</button></div>" +
    GROUPS.map(([g, slugs]) => '<div class="py-3 border-t border-border first:border-0"><p class="mb-1 text-xs font-medium uppercase tracking-wider text-muted-foreground">' + g + "</p>" +
      slugs.map(s => '<a href="#" class="flex items-center justify-between rounded-lg px-2 py-1.5 text-sm hover:bg-black/5">' + CAT[s].name + "</a>").join("") + "</div>").join("") + "</div></aside>";
}
window.openDrawer = () => { drawer.style.translate = "0 0"; scrim.style.opacity = 1; scrim.style.pointerEvents = "auto"; };
window.closeDrawer = () => { drawer.style.translate = ""; scrim.style.opacity = 0; scrim.style.pointerEvents = "none"; };
window.toHero = () => { window.scrollTo({ top: frame.offsetTop, behavior: "smooth" }); setTimeout(() => document.querySelector("#heroSearch input").focus(), 400); };

function home() {
  return '<main class="mx-auto max-w-6xl px-4 @3xl:px-8 pb-24">' +
    '<section class="pt-16 pb-4 @3xl:pt-28 @3xl:pb-8 text-center">' +
    '<h1 class="mx-auto max-w-2xl text-4xl @3xl:text-6xl font-semibold tracking-tight leading-[1.05]">What are you shopping for today?</h1>' +
    '<p class="mx-auto mt-4 max-w-md text-muted-foreground">Clear prices, and a real delivery date before you check out.</p>' +
    '<div id="heroWrap" class="mx-auto mt-8 max-w-2xl">' + searchForm(true, "heroSearch") + "</div></section>" +
    rail("Today's deals", "Biggest price drops right now", DATA.deals) +
    rail("Top rated", "Loved by thousands of shoppers", DATA.top) +
    '<section class="mt-20 text-center"><button onclick="openDrawer()" class="inline-flex h-11 items-center gap-2 rounded-full border border-input bg-white/70 px-6 text-sm font-medium hover:bg-white transition-colors">' + I.menu + " Browse all departments</button></section>" +
    "</main>";
}

const state = { width: "desktop" };
let io;
function render() {
  app.innerHTML = header() + home();
  frame.style.maxWidth = state.width === "mobile" ? "390px" : "1240px";
  document.querySelectorAll("#seg-width button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.width));
  io && io.disconnect();
  io = new IntersectionObserver(([e]) => hdr.classList.toggle("scrolled", !e.isIntersecting), { rootMargin: "-80px 0px 0px 0px" });
  io.observe(heroWrap);
}
document.querySelectorAll("#seg-width button").forEach(b => b.onclick = () => { state.width = b.dataset.v; render(); });
render();
</script>
